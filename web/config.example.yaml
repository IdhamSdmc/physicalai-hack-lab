# Configuración del panel de control SO-101
# Copia este archivo como config.yaml antes de arrancar el servidor.

server:
  # 0.0.0.0 permite acceder desde http://localhost:8000 y desde otro dispositivo en la red local (http://<IP_MAC>:8000)
  host: "0.0.0.0"
  port: 8000

task:
  # true = modo simulación (no toca el robot). Cambiar a false solo para usar el comando real.
  mock_mode: true
  # Duración de la tarea simulada en segundos (cuando mock_mode es true)
  mock_duration_seconds: 10
  # Directorio de trabajo del proyecto físico (obligatorio para rutas relativas de scripts y lerobot/src)
  working_dir: "/Users/coalva94/Documents/Code/Hackaton/physicalai-hack-lab"
  # Comando real que lanza el supervisor autónomo (se usa cuando mock_mode es false)
  command: "env PYTHONUNBUFFERED=1 PYTHONPATH=lerobot/src PYTORCH_ENABLE_MPS_FALLBACK=1 /Users/coalva94/Documents/Code/Hackaton/physicalai-hack-lab/.venv/bin/python -u scripts/10_opencv_triage_supervisor.py --mode run --cam-top 1 --cam-wrist 0 --port /dev/tty.usbmodem5B610343371 --robot-id bilbao_follower"

telemetry:
  # Rutas relativas a task.working_dir para mostrar estado y HUD generados por el supervisor
  hud_image_path: "outputs/triage_hud_latest.jpg"
  scene_map_path: "outputs/triage_scene_map.json"

ui:
  # Cada cuántos milisegundos consulta el navegador el estado del servidor
  poll_interval_ms: 750
  # Número máximo de líneas recientes en el registro de actividad
  log_max_lines: 60
